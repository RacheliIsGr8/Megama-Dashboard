<div
  class="tmunat-moamad"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()">

  <div class="tmunat-moamad__thumb" [ngStyle]="styleThumb">
    <img
      *ngIf="urlTmuna; else placeholder"
      class="tmunat-moamad__thumb-img"
      [src]="urlTmuna"
      [alt]="shemMale">
    <ng-template #placeholder>
      <div class="tmunat-moamad__placeholder" aria-hidden="true"></div>
    </ng-template>
  </div>

  <div
    class="tmunat-moamad__popup"
    *ngIf="isPopupPatuach && urlTmuna"
    [ngStyle]="stylePopup"
    aria-hidden="true">
    <div
      class="tmunat-moamad__popup-tmuna-wrap"
      [style.border-color]="colorLeMoamad || '#e5e7eb'">
      <img
        class="tmunat-moamad__popup-tmuna"
        [src]="urlTmuna"
        [alt]="shemMale">
    </div>
    <span
      class="tmunat-moamad__popup-shem"
      *ngIf="shemMale"
      [style.background]="colorLeMoamad || '#e5e7eb'">
      {{ shemMale }}
    </span>
  </div>
</div>
