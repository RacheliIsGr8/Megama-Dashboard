<div class="tziyunim-moamad">
  <div
    class="tziyunim-moamad__midda"
    *ngFor="let midda of midot; trackBy: trackByMidda">
    <span class="tziyunim-moamad__midda-shem">{{ midda.shem }}</span>

    <span
      *ngIf="midda.erech != null; else erechChasum"
      class="tziyunim-moamad__badge"
      [ngClass]="getClassRama(midda.sugRama)">
      {{ midda.erech }}
    </span>
    <ng-template #erechChasum>
      <span class="tziyunim-moamad__chasum">••••</span>
    </ng-template>

    <span class="tziyunim-moamad__icon" aria-hidden="true">
      <svg
        *ngIf="midda.sugIcon === 'amudot'"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        focusable="false">
        <path d="M3 3v16a2 2 0 0 0 2 2h16"></path>
        <path d="M18 17V9"></path>
        <path d="M13 17V5"></path>
        <path d="M8 17v-3"></path>
      </svg>
      <svg
        *ngIf="midda.sugIcon === 'magen'"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        focusable="false">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
    </span>
  </div>

  <div class="tziyunim-moamad__merkazim">
    <div
      class="tziyunim-moamad__merkaz"
      *ngFor="let merkaz of merkazim; trackBy: trackByMerkaz">
      <p class="tziyunim-moamad__merkaz-shura">
        <span class="tziyunim-moamad__merkaz-shem">{{ merkaz.shem }}:</span>
        <span
          class="tziyunim-moamad__badge"
          [ngClass]="getClassRama(merkaz.sugRama)">
          {{ merkaz.erech }}
        </span>
      </p>
      <p class="tziyunim-moamad__merkaz-teur">{{ merkaz.teur }}</p>
    </div>
  </div>

  <div class="tziyunim-moamad__statusim">
    <div
      *ngFor="let status of statusim; trackBy: trackByStatus"
      [ngClass]="getClassStatus(status)">
      <svg
        *ngIf="status.sug === 'hatzlacha'"
        class="tziyunim-moamad__status-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <svg
        *ngIf="status.sug !== 'hatzlacha'"
        class="tziyunim-moamad__status-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <path d="M12 9v4"></path>
        <path d="M12 17h.01"></path>
      </svg>
      <span class="tziyunim-moamad__status-tekst">{{ status.tekst }}</span>
    </div>
  </div>
</div>
